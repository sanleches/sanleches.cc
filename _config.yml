# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: sanleches.io
subtitle: Systems, embedded software, and practical engineering
description: |-
  I'm Santiago Ugarte, a software developer based in Ottawa and currently at Kinaxis. My background spans computer engineering technology, computer science, and mechatronics. I build with C++, C, Linux, embedded systems, Qt, CMake, .NET, and practical AI/RAG systems.

  This is where I document projects, experiments, and lessons learned while building software and hardware.

  ## Contract Work

  I'm open to contract development, consulting, and interesting technical collaborations.

  - C and C++ systems development
  - Embedded firmware and hardware integration
  - Linux tooling, device interfaces, and driver prototypes
  - Qt applications, CMake builds, and developer tooling
  - .NET web applications, RAG pipelines, vector search, and internal AI tools
  - Technical prototypes, debugging, and codebase cleanup

  I like projects where I can dig below the surface, understand how the pieces actually work, and leave behind code that is easier to reason about. Short projects, ongoing contract work, and unusual hardware or systems problems are all welcome.

  [Contact me by email](mailto:santiago.ugarte98@gmail.com) or connect with me on [LinkedIn](https://www.linkedin.com/in/santiago-ugarte-419200152) to discuss a project.

  ## Recognition

  FluKsAI won second place in the [2025 Legal AI Innovators Award](https://ironcladapp.com/resources/articles/winners-legal-ai-innovators-award-2025). [Read the build story](/2025/03/06/fluksai-contract-rag/).
keywords: C++, C, Linux, embedded systems, Qt, CMake, .NET, AI, RAG, vector search, mechatronics, software engineering
author: Santiago Ugarte
language: en
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://sanleches.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: cactus

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
